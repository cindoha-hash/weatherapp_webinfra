<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeatherWatch</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">YOUR DAILY FORECAST</p>
        <h1>WeatherWatch</h1>
      </div>
      <button id="unit" aria-label="Switch to Fahrenheit">°C / °F</button></header>
<form id="search">
  <label for="city">Find a city</label>
  <div class="searchline"><input id="city" minlength="2" maxlength="100" placeholder="e.g. Kigali, London, Nairobi" required><button>Search</button></div>
</form>
<p id="status" role="status" aria-live="polite"></p>
    <div id="results" class="results"></div>
<section id="weather" hidden><article class="hero">
  <p class="eyebrow">CURRENT CONDITIONS</p>
  <h2 id="place"></h2>
  <div class="current"><div><div id="temperature" class="temperature"></div><p id="condition"></p></div>
    <span id="symbol" class="symbol" aria-hidden="true"></span>
  </div><div id="metrics" class="metrics"></div><p id="updated" class="muted"></p></article>
  
<section class="forecast">
  <div class="sectionhead">
    <h2>7-day forecast</h2>
    <div class="controls"><label>Sort <select id="sort"><option value="date">Date</option><option value="hot">Warmest first</option><option value="cold">Coolest first</option><option value="rain">Rain chance</option></select></label><label>Filter <select id="filter"><option value="all">All days</option><option value="dry">Rain chance below 50%</option><option value="wet">Rain chance 50% or more</option></select></label></div>
  </div>
  <div id="days" class="days"></div><h2>Temperature trend</h2><div id="trend" class="trend"></div>
</section> </section>
<footer>Weather data and geocoding by <a href="https://open-meteo.com/">Open-Meteo</a>. Forecasts are estimates, not official emergency warnings.</footer>
  </main>
</body>
</html>
